association"><path d="M117.527,444.809 C157.339,441.139 236.333,433.857 289.227,428.981" style="stroke:#000;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0015" id="lnk25" data-link-type="association"><path d="M117.527,449.388 C155.552,452.893 229.319,459.694 281.951,464.545" style="stroke:#000;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0016" id="lnk26" data-link-type="association"><path d="M117.308,456.17 C145.677,466.388 193.839,483.011 236.192,494.099 C254.25,498.826 274.284,503.051 292.029,506.45" style="stroke:#000;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0017" id="lnk27" data-link-type="association"><path d="M117.232,465.998 C128.046,474.049 141.035,483.35 153.192,491.099 C188.758,513.767 197.059,521.37 236.192,537.099 C246.965,541.429 258.623,545.285 270.131,548.647" style="stroke:#000;stroke-width:1;" fill="none"/></g><g class="legend" data-source-line="90"><rect x="12" y="631.099" width="496.384" height="187.085" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="649.23" fill="#000" font-size="14" textLength="170.386" font-weight="700" font-family="Arial">Nao existe auto-cadastro.</text><text x="191.275" y="649.23" fill="#000" font-size="14" textLength="301.198" font-family="Arial">O Visitante so se autentica: nenhuma identidade</text><text x="17" y="665.329" fill="#000" font-size="14" textLength="486.384" font-family="Arial">nasce de requisicao anonima. Criar conta exige um Professor autenticado, e a</text><text x="17" y="681.428" fill="#000" font-size="14" textLength="230.364" font-family="Arial">autoria de cada conta fica registrada.</text><text x="17" y="697.526" fill="#000" font-size="14" font-family="Arial"> </text><text x="17" y="713.625" fill="#000" font-size="14" textLength="257.53" font-weight="700" font-family="Arial">Por que o Professor cadastra usuarios</text><text x="278.42" y="713.625" fill="#000" font-size="14" textLength="220.213" font-family="Arial">— nao ha perfil ADMIN no dominio.</text><text x="17" y="729.724" fill="#000" font-size="14" textLength="470.818" font-family="Arial">Sem nivel acima para autorizar, a contencao disponivel e a trilha de autoria,</text><text x="17" y="745.822" fill="#000" font-size="14" textLength="105.075" font-family="Arial">nao a hierarquia.</text><text x="17" y="761.921" fill="#000" font-size="14" font-family="Arial"> </text><text x="17" y="778.02" fill="#000" font-size="14" textLength="70" font-weight="700" font-family="Arial">Bootstrap.</text><text x="90.89" y="778.02" fill="#000" font-size="14" textLength="381.309" font-family="Arial">O primeiro professor nao pode ter sido criado por outro. Ele e</text><text x="17" y="794.118" fill="#000" font-size="14" textLength="485.557" font-family="Arial">inserido por script administrativo, com acesso ao banco, FORA da fronteira do</text><text x="17" y="810.217" fill="#000" font-size="14" textLength="322.164" font-family="Arial">sistema — por isso nao aparece como caso de uso.</text></g><?plantuml-src RLJ9Rjmm3BtxAzWSWymW0P9qEHIOfYdGGzAWHNgQ2yVIp12rHKUIWw0Bq8_e5_PB-kXbjkPYM1JvzFYul91GLgtpv5EMIYTjNKq5dwBooqnPASfgdSb9z6KM3KMH9LUUhZXf8iIrIUdlxp_4fK_uzSIkbY0fHovPoJ4r5MTUQgovABZC6kdegoJ97B8_8awqEOtNzwdbA3eFipRxaALafvtdS37wpQesz1VTtsY-YxeqCh6xsfoAelEYoUJdsmtIvdRVN5Yw75R8zEXkmz_odJKgIamt6WIl2H_HZu8WWoyvmNj3EKvIdzxzrUbPiUjoOxb6udbeeZQ0e593vj7vVDVt-gcfD7AaUdmlpGCenyoEqnXoiHjofI6rLKPC0zZMoZ0FdYA7Rn9MOyZbio7pm2iVh6Wc2bUZzyld4YYXIwKhe4CN9wcKffAmPVLgxmdZcoqJtbGDFg_vUQTchuRckDXpX10xcWnEPwVFwo31TJqKFSJRwyWnyApuLHIRFaGl35KR-c4md1-SBmxEbmTdgBRRNxqcXnOey9zfSMX2PeSMiAky5OiMchFMIFtu-1OZvvymVPZ3Dkkax0NLwV4nVTeE6c5IK-VIz-eR2ZwiMtIuEBCuTXvug6NfhUcZVsWHQmFD0QBNFAM-15tdsfChh89wEsnRRASdjXK0Puoism5el8RO9NpmmAfR6OwdHPV87I0UMa-w0paamoXnft92KhPw0cYjhMNZKYgQlR_vU4kOSwUsY7GAl2--fY2FliAQ0dbg62WzdUySJwZduaEtiIHXRZfdqAOSfLftd0Vw9vqmjWBMuj6gK6Oa_Kur6y6cbnkZNNk9kctcBh1HWDdy975A9I2T6IDfQvMYQo