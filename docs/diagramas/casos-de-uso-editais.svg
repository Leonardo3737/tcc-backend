<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="1085" viewBox="0 0 1350 1085" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1350" height="1085" fill="#ffffff"/>

  <!-- ================= fronteira do sistema ================= -->
  <rect x="150" y="36" width="1045" height="904" fill="#fbfbfb" stroke="#111" stroke-width="1.6"/>
  <text x="672" y="68" font-size="17.5" font-weight="bold" text-anchor="middle" fill="#111">Módulo de Editais — Plataforma de Apoio à Monitoria</text>

  <!-- ================= atores ================= -->
  <!-- Candidato -->
  <g stroke="#111" stroke-width="1.7" fill="none" stroke-linecap="round">
    <circle cx="72" cy="150" r="14" fill="#ffffff"/>
    <line x1="72" y1="164" x2="72" y2="208"/>
    <line x1="48" y1="180" x2="96" y2="180"/>
    <line x1="72" y1="208" x2="55" y2="238"/>
    <line x1="72" y1="208" x2="89" y2="238"/>
  </g>
  <text x="72" y="262" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Candidato</text>
  <text x="72" y="280" font-size="11.5" text-anchor="middle" fill="#333">(visitante, sem conta)</text>

  <!-- Servico de e-mail -->
  <g stroke="#111" stroke-width="1.7" fill="none" stroke-linecap="round">
    <circle cx="72" cy="400" r="14" fill="#ffffff"/>
    <line x1="72" y1="414" x2="72" y2="458"/>
    <line x1="48" y1="430" x2="96" y2="430"/>
    <line x1="72" y1="458" x2="55" y2="488"/>
    <line x1="72" y1="458" x2="89" y2="488"/>
  </g>
  <text x="72" y="512" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Serviço de E-mail</text>
  <text x="72" y="530" font-size="11.5" text-anchor="middle" fill="#333">(Brevo)</text>

  <!-- Professor -->
  <g stroke="#111" stroke-width="1.7" fill="none" stroke-linecap="round">
    <circle cx="1265" cy="430" r="14" fill="#ffffff"/>
    <line x1="1265" y1="444" x2="1265" y2="488"/>
    <line x1="1241" y1="460" x2="1289" y2="460"/>
    <line x1="1265" y1="488" x2="1248" y2="518"/>
    <line x1="1265" y1="488" x2="1282" y2="518"/>
  </g>
  <text x="1265" y="542" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Professor</text>
  <text x="1265" y="560" font-size="11.5" text-anchor="middle" fill="#333">(autenticado)</text>

  <!-- ================= associacoes ================= -->
  <g stroke="#111" stroke-width="1.3" fill="none">
    <!-- Candidato -->
    <line x1="96" y1="181" x2="183" y2="124"/>
    <line x1="96" y1="181" x2="183" y2="206"/>
    <!-- Servico de e-mail -->
    <line x1="96" y1="420" x2="483" y2="210"/>
    <!-- Professor (feixe unico) -->
    <line x1="1243" y1="458" x2="1043" y2="122"/>
    <line x1="1243" y1="458" x2="1043" y2="207"/>
    <line x1="1243" y1="458" x2="1043" y2="293"/>
    <line x1="1243" y1="458" x2="1043" y2="379"/>
    <line x1="1243" y1="458" x2="1043" y2="464"/>
    <line x1="1243" y1="458" x2="1043" y2="550"/>
    <line x1="1243" y1="458" x2="1043" y2="636"/>
    <line x1="1243" y1="458" x2="1043" y2="722"/>
    <line x1="1243" y1="458" x2="1043" y2="808"/>
  </g>

  <!-- ================= casos de uso: Candidato (publicos) ================= -->
  <g stroke="#111" stroke-width="1.5">
    <ellipse cx="300" cy="120" rx="118" ry="37" fill="#f1f1f1"/>
    <ellipse cx="300" cy="208" rx="118" ry="37" fill="#f1f1f1"/>
  </g>
  <g font-size="13.5" text-anchor="middle" fill="#111">
    <text x="300" y="116">Consultar editais</text>
    <text x="300" y="133">abertos</text>
    <text x="300" y="204">Inscrever-se no</text>
    <text x="300" y="221">edital</text>
  </g>

  <!-- ================= casos de uso incluidos pela inscricao ================= -->
  <g stroke="#111" stroke-width="1.5">
    <ellipse cx="600" cy="120" rx="118" ry="37" fill="#ffffff"/>
    <ellipse cx="600" cy="208" rx="118" ry="37" fill="#ffffff"/>
  </g>
  <g font-size="13.5" text-anchor="middle" fill="#111">
    <text x="600" y="116">Anexar boletim</text>
    <text x="600" y="133">em PDF</text>
    <text x="600" y="196">Enviar e-mail de</text>
    <text x="600" y="213">confirmação ao</text>
    <text x="600" y="230">candidato</text>
  </g>

  <!-- ================= casos de uso: Professor ================= -->
  <g stroke="#111" stroke-width="1.5">
    <ellipse cx="920" cy="120" rx="122" ry="37" fill="#eaeaea"/>
    <ellipse cx="920" cy="206" rx="122" ry="37" fill="#eaeaea"/>
    <ellipse cx="920" cy="292" rx="122" ry="37" fill="#eaeaea"/>
    <ellipse cx="920" cy="378" rx="122" ry="37" fill="#eaeaea"/>
    <ellipse cx="920" cy="464" rx="122" ry="37" fill="#eaeaea"/>
    <ellipse cx="920" cy="550" rx="122" ry="37" fill="#eaeaea"/>
    <ellipse cx="920" cy="636" rx="122" ry="37" fill="#eaeaea"/>
    <ellipse cx="920" cy="722" rx="122" ry="37" fill="#eaeaea"/>
    <ellipse cx="920" cy="808" rx="122" ry="37" fill="#eaeaea"/>
  </g>
  <g font-size="13.5" text-anchor="middle" fill="#111">
    <text x="920" y="125">Cadastrar edital</text>
    <text x="920" y="211">Editar edital</text>
    <text x="920" y="297">Consultar editais</text>

    <text x="920" y="374">Excluir edital</text>
    <text x="920" y="391">(exclusão lógica)</text>

    <text x="920" y="460">Consultar</text>
    <text x="920" y="477">candidaturas</text>

    <text x="920" y="546">Consultar resumo</text>
    <text x="920" y="563">por disciplina</text>

    <text x="920" y="632">Exportar candidaturas</text>
    <text x="920" y="649">em planilha (.xlsx)</text>

    <text x="920" y="718">Baixar boletim</text>
    <text x="920" y="735">do candidato</text>

    <text x="920" y="804">Aprovar</text>
    <text x="920" y="821">candidatura</text>
  </g>

  <!-- ================= casos de uso da aprovacao ================= -->
  <g stroke="#111" stroke-width="1.5">
    <ellipse cx="600" cy="700" rx="118" ry="37" fill="#ffffff"/>
    <ellipse cx="600" cy="808" rx="118" ry="37" fill="#ffffff"/>
    <ellipse cx="600" cy="896" rx="118" ry="37" fill="#ffffff" stroke-dasharray="7 4"/>
  </g>
  <g font-size="13.5" text-anchor="middle" fill="#111">
    <text x="600" y="696">Registrar monitoria</text>
    <text x="600" y="713">da disciplina</text>

    <text x="600" y="804">Habilitar aluno</text>
    <text x="600" y="821">como monitor</text>

    <text x="600" y="892">Cadastrar conta</text>
    <text x="600" y="909">de aluno</text>
  </g>

  <!-- ================= include / extend ================= -->
  <g stroke="#111" stroke-width="1.3" fill="none" stroke-dasharray="7 5" marker-end="url(#seta)">
    <!-- inscricao -->
    <line x1="412" y1="190" x2="481" y2="132"/>
    <line x1="420" y1="208" x2="479" y2="208"/>
    <!-- aprovacao -->
    <line x1="797" y1="792" x2="721" y2="716"/>
    <line x1="796" y1="808" x2="721" y2="808"/>
    <!-- extend: do caso extensor para o caso base -->
    <line x1="719" y1="884" x2="795" y2="826"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#111">
    <text x="452" y="155">«include»</text>
    <text x="450" y="201">«include»</text>
    <text x="760" y="744">«include»</text>
    <text x="758" y="801">«include»</text>
    <text x="752" y="866">«extend»</text>
  </g>
  <text x="752" y="878" font-size="9.5" text-anchor="middle" fill="#444">[e-mail sem conta]</text>

  <!-- ================= nota ================= -->
  <path d="M 200 744 L 434 744 L 452 762 L 452 878 L 200 878 Z" fill="#fffdf2" stroke="#111" stroke-width="1.2"/>
  <path d="M 434 744 L 434 762 L 452 762" fill="none" stroke="#111" stroke-width="1.2"/>
  <line x1="452" y1="862" x2="484" y2="890" stroke="#111" stroke-width="1.1" stroke-dasharray="5 4"/>
  <g font-size="11.5" fill="#111">
    <text x="213" y="779">A conta nasce com senha provisória</text>
    <text x="213" y="796">gerada pelo servidor e entregue por</text>
    <text x="213" y="813">e-mail. Se o e-mail da inscrição já</text>
    <text x="213" y="830">tiver conta, ela é reaproveitada e</text>
    <text x="213" y="847">nunca alterada. A monitoria da oferta</text>
    <text x="213" y="864">também é reaproveitada quando existe.</text>
  </g>

  <!-- ================= legenda ================= -->
  <g stroke="#111" stroke-width="1.3" fill="none">
    <line x1="170" y1="996" x2="225" y2="996"/>
    <line x1="170" y1="1026" x2="221" y2="1026" stroke-dasharray="7 5" marker-end="url(#seta)"/>
    <line x1="170" y1="1056" x2="221" y2="1056" stroke-dasharray="7 5" marker-end="url(#seta)"/>
  </g>
  <g font-size="12" fill="#111">
    <text x="237" y="1000">associação entre ator e caso de uso</text>
    <text x="237" y="1030">«include» — parte obrigatória do caso de uso base</text>
    <text x="237" y="1060">«extend» — ocorre apenas sob a condição indicada</text>
    <text x="700" y="1000">Os casos de uso do Candidato são públicos: dispensam autenticação.</text>
    <text x="700" y="1030">A inscrição não cria conta de usuário; a aprovação é o único caminho.</text>
    <text x="700" y="1060">A exclusão de edital é lógica (ativo = false): nenhum dado é apagado.</text>
  </g>
</svg>
