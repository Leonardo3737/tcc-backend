="161"><rect x="12" y="749.099" width="509.57" height="138.789" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="767.23" fill="#000" font-size="14" textLength="164.903" font-weight="700" font-family="Arial">Habilitar monitor (RN01).</text><text x="185.793" y="767.23" fill="#000" font-size="14" textLength="319.074" font-family="Arial">Somente o professor responsavel habilita um aluno</text><text x="17" y="783.329" fill="#000" font-size="14" textLength="282.454" font-family="Arial">como MONITOR. E este ato que cria o papel.</text><text x="17" y="799.428" fill="#000" font-size="14" font-family="Arial"> </text><text x="17" y="815.526" fill="#000" font-size="14" textLength="227.192" font-weight="700" font-family="Arial">Inscrever-se em monitoria (RN09).</text><text x="248.082" y="815.526" fill="#000" font-size="14" textLength="268.488" font-family="Arial">Um aluno nao pode assumir os dois papeis</text><text x="17" y="831.625" fill="#000" font-size="14" textLength="130.717" font-family="Arial">na mesma monitoria.</text><text x="17" y="847.724" fill="#000" font-size="14" font-family="Arial"> </text><text x="17" y="863.822" fill="#000" font-size="14" textLength="162.6" font-weight="700" font-family="Arial">Declarar disponibilidade</text><text x="183.489" y="863.822" fill="#000" font-size="14" textLength="297.247" font-family="Arial">e exclusivo do Monitor: o professor administra a</text><text x="17" y="879.921" fill="#000" font-size="14" textLength="318.315" font-family="Arial">monitoria, mas nao possui agenda de atendimento.</text></g><?plantuml-src RLJDRjim3BxhARYSjc09clwjsM50qHLR3_r1jjvwOMKs9I2BdYG70xO1UuW-uPvaj6EdIkABOLBVHrAVIBvXRrrT451Cx6HIbsxA-Z6EdX8aWS3BvmG51xA9nHkJE3c22umIGNbr5FZtzmMM6W052eHIF2S9Z41GOKXikKABOWnQzSFetDLUHe0Hsh_UVRtcjGVT_yuH5fAVgja3xe8yKOmTUsFj7J_u1SLAVCGLkHQRsSPqWM4o-VsfA-urL-xDM6ltQqhJA8L-gIADxXmcV99GOYFLUIKiW7tvZ2FuPK0L98jHqLyeaBUC0InRfrhIWr-nAfgBsXPzVp4xp9bVyP4T9sMMcOYAEifHLpxQG2lQe7ez5NWy29n4BO7A_UmdEVpIMmf1a-Ult