services:
  postgres:
    image: postgres:16-alpine
    container_name: monitoria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: monitoria
      POSTGRES_USER: monitoria
      POSTGRES_PASSWORD: monitoria
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U monitoria -d monitoria']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
